name: Deploy to GitHub Pages

# Deploys src/ (the real multi-file source — plain CSS/JS/font/data
# requests, no inlining needed) directly to GitHub Pages. build.sh still
# runs first as a sanity check: if it can't fold src/ into a single
# Artifact-ready file, something in src/ is broken, and that should fail
# the deploy rather than ship silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build (sanity check)
        run: ./build.sh
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
