<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <title>Raid Alps maskable icon</title>
  <!-- Android "maskable" variant. Launchers crop this to arbitrary shapes
       (circle, squircle, teardrop), guaranteeing only a centred circle of 80%
       diameter survives. Measured against that safe radius of 72, the mark in
       tools/icon-master.svg reaches 93.4 and would lose the ends of the
       profile, so it is scaled to 0.75 about the centre here. Everything else
       matches the master.
       Regenerate after editing:
         rsvg-convert -w 512 -h 512 tools/icon-maskable.svg -o src/images/icon-maskable-512.png
       NB: no double hyphens in XML comments. -->
  <rect width="180" height="180" fill="#0b0f14"/>
  <g transform="translate(90,90) scale(0.75) translate(-90,-90)">
    <path d="M22.5 140.625 L61.875 84.375 L84.375 106.875 L118.125 39.375 L157.5 140.625"
          fill="none" stroke="#c98500" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
